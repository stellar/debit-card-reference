name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_call: # allows this workflow to be called from another workflow

permissions:
  contents: read

jobs:
  contract_build:
    name: Contract Build
    uses: ./.github/workflows/contract_build.yml

  complete:
    name: complete
    if: always()
    needs:
      - contract_build
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
