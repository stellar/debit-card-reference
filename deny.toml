# cargo-deny configuration. Run with: cargo deny check
#
# Tight permissive-license allowlist, advisories (version 2) with documented
# per-ID ignores, strict bans/sources. Skip/ignore/exception entries are
# calibrated to this repo's tree; skipped duplicates are dev/build-time tooling
# that does not ship in the contract wasm.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32v1-none" },
]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # `derivative` is unmaintained; a transitive dependency of the soroban-sdk tree.
    "RUSTSEC-2024-0388",
    # `paste` is unmaintained; a transitive dependency of the soroban-sdk tree.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8
# unicode-ident is dual MIT/Apache but its SPDX expression also AND-requires
# Unicode-3.0; allow it for this crate only, leaving the global allowlist intact.
exceptions = [
    { name = "unicode-ident", allow = ["Unicode-3.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Skip the older of each dev/build-time duplicate so the newer one remains.
skip = [
    { name = "darling", version = "=0.20.11" },
    { name = "darling_core", version = "=0.20.11" },
    { name = "darling_macro", version = "=0.20.11" },
    { name = "hashbrown", version = "=0.13.2" },
    { name = "stellar-strkey", version = "=0.0.13" },
    { name = "syn", version = "=1.0.109" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["stellar"]
